{% extends "accounts/dashboard_base.html" %}

{% block dashboard_content %}
<div class="max-w-xl mx-auto mt-10 px-6 py-8 bg-white rounded-lg shadow">
  <div class="flex items-center gap-3 mb-4">
    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-red-100 text-red-700 text-xl">&times;</span>
    <h1 class="text-xl font-semibold text-gray-900">Payment couldn't be started</h1>
  </div>
  <p class="text-gray-600 mb-6">{{ error }}</p>
  {% if tenancy %}
    <a href="{% url 'tenancies:tenancy_detail' pk=tenancy.pk %}"
       class="inline-block px-4 py-2 rounded-md bg-gray-900 text-white text-sm font-medium hover:bg-gray-800">
      Back to tenancy
    </a>
  {% endif %}
</div>
{% endblock %}
